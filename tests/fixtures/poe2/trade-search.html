<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Path of Exile 2 Trade</title>
  </head>
  <body>
    <div class="search-panel">
      <div class="search-bar">
        <div class="search-left">
          <input type="text" placeholder="Search items..." />
        </div>
        <button class="btn search-btn" type="button">Search</button>
      </div>
    </div>

    <div class="search-advanced-pane brown">
      <div class="filter-group expanded">
        <div class="filter-group-body">
          <div class="filter filter-property">
            <div class="filter-title">Name</div>
            <div class="multiselect">
              <input class="multiselect__input" type="text" />
              <div class="multiselect__option">Exalted Orb</div>
            </div>
          </div>
          <div class="filter">
            <div class="filter-title">Price</div>
            <input class="minmax" type="text" placeholder="Min" />
          </div>
        </div>
      </div>
    </div>

    <div class="resultset">
      <div class="result-item" data-id="row1">
        <div class="left">
          <button class="copy" type="button">Copy</button>
        </div>
        <div class="item-popup" data-id="item1">
          <div class="item-popup__header item-popup__header--unique">
            <div class="item-popup__header-line">Astramentis</div>
          </div>
          <div class="item-popup__content">
            <div class="item-mod item-mod--implicit" data-id="mod1">
              <span class="lc s" data-field="stat.allAttributes">+10 to all Attributes</span>
              <span class="lc l">(implicit)</span>
              <span class="lc r">10</span>
            </div>
            <div class="item-mod item-mod--explicit" data-id="mod2">
              <span class="lc s" data-field="stat.3372524247">+12% to Fire Resistance</span>
              <span class="lc l">T1</span>
              <span class="lc r su">12</span>
            </div>
            <hr name="explicit" />
            <div class="item-property" data-field="price">
              <span class="price">2 exalted</span>
              <span class="currency-text"><span>Exalted Orb</span></span>
            </div>
            <span class="icon"><img alt="Astramentis" /></span>
          </div>
        </div>
      </div>

      <div class="result-item" data-id="row2">
        <div class="left">
          <button class="copy" type="button">Copy</button>
        </div>
        <div class="item-popup" data-id="item2">
          <div class="item-popup__header item-popup__header--unique">
            <div class="item-popup__header-line">Hand of Wisdom and Action</div>
          </div>
          <div class="item-popup__content">
            <div class="item-mod item-mod--explicit" data-id="mod3">
              <span class="lc s" data-field="stat.1671376347">+18% to Lightning Resistance</span>
              <span class="lc l">T2</span>
              <span class="lc r">18</span>
            </div>
            <div class="item-property" data-field="price">
              <span class="price">30 chaos</span>
              <span class="currency-text"><span>Chaos Orb</span></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row" data-id="row3">
      <div class="left">
        <button class="copy" type="button">Copy</button>
      </div>
      <span class="profile-link"><a href="#">Seller</a></span>
    </div>

    <span class="account-name">Account</span>
  </body>
</html>
